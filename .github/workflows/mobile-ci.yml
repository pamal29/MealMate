name: Mobile CI

on:
  pull_request:
    paths: ['mobile/**']
  push:
    branches: ['main']
    paths: ['mobile/**']

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: |
          if [ -d test ]; then flutter test; else echo "No tests yet, skipping"; fi